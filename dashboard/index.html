<!doctype html>
<html lang="id">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>RAKAN Dashboard</title>

<link rel="stylesheet" href="style.css"/>

</head>

<body>

<header>

<h1>RAKAN Dashboard</h1>

<p>Editorial Operating System</p>

</header>

<main>

<section class="grid">

<div class="card">

<h2 id="articles">0</h2>

<span>Artikel</span>

</div>

<div class="card">

<h2 id="books">0</h2>

<span>Buku</span>

</div>

<div class="card">

<h2 id="pages">0</h2>

<span>Halaman</span>

</div>

<div class="card">

<h2 id="score">--</h2>

<span>Health Score</span>

</div>

</section>

<section class="actions">

<button id="newArticle">
📝 Artikel Baru
</button>

<button id="doctor">
🩺 Doctor
</button>

<button id="publish">
🚀 Publish
</button>

</section>

<section class="terminal">

<pre id="output">
Siap.
</pre>

</section>

</main>

<script src="app.js"></script>

</body>
</html>
